services:
  db:
    image: mariadb:10.11
    container_name: ${STACK_NAME:-toncity}_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-db_main}
    ports:
      - "${DB_EXPOSED_PORT:-3377}:3306"
    volumes:
      - ./db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 10
  bot:
    image: ${BOT_IMAGE:-ghcr.io/corsairguy/toncity_bot}:${BOT_TAG:-latest}
    container_name: ${STACK_NAME:-toncity}_bot
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      WEB_BIND: 0.0.0.0
    init: true
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    stop_grace_period: 15s
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g
  updater:
    image: ${BOT_IMAGE:-ghcr.io/corsairguy/toncity_bot}:updater
    container_name: ${STACK_NAME:-toncity}_updater
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project
    environment:
      BOT_CONTAINER: ${STACK_NAME:-toncity}_bot
      TZ: UTC
    restart: unless-stopped
volumes:
  db_data:
