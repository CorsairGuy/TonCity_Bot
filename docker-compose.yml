services:
  db:
    image: mariadb:10.11
    # Имя контейнера параметризовано, чтобы на одном хосте можно было поднять НЕСКОЛЬКО
    # экземпляров бота. container_name — глобально уникальное имя на весь демон Docker, его не
    # спасает даже отдельный проект compose (в отличие от volume/network, которым compose сам
    # приписывает префикс проекта) — отсюда «Conflict. The container name is already in use».
    # Второй экземпляр: свой каталог, свой .env со STACK_NAME/WEB_PORT/DB_EXPOSED_PORT.
    container_name: ${STACK_NAME:-toncity}_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-db_main}
    ports:
      - "${DB_EXPOSED_PORT:-3377}:3306"
    volumes:
      - ./db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 10
  bot:
    # Готовый образ из GitHub Container Registry (собирает .github/workflows/docker.yml на каждый
    # push в main). Код, зависимости и собранная панель — внутри образа, на сервере ничего не
    # собирается. BOT_TAG=sha-<коммит> в .env — откат на конкретную версию (по умолчанию latest).
    # Для разработки с правкой кода на месте — docker-compose.dev.yml (см. README).
    image: ${BOT_IMAGE:-ghcr.io/corsairguy/toncity_bot}:${BOT_TAG:-latest}
    container_name: ${STACK_NAME:-toncity}_bot
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      # В контейнере слушаем на всех интерфейсах, иначе публикация порта (ports) не достучится
      # до приложения. Доступ снаружи защищён паролем веб-панели (задаётся в Настройках).
      WEB_BIND: 0.0.0.0
      # Адрес Watchtower внутри сети compose — для кнопки «Обновить» в панели.
      WATCHTOWER_URL: http://watchtower:8080
    # init: tini пробрасывает SIGTERM процессу node → срабатывает graceful shutdown (src/index.js).
    init: true
    ports:
      # ОБЕ стороны берём из WEB_PORT — приложение внутри контейнера слушает именно этот порт
      # (src/config.js: webPort=process.env.WEB_PORT), а не захардкоженный 3000.
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    labels:
      # Watchtower обновляет только этот контейнер и только «свой» (scope = STACK_NAME), чтобы
      # несколько копий бота на одном хосте не трогали друг друга. База не обновляется никогда.
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: ${STACK_NAME:-toncity}
    # SIGTERM бот обрабатывает штатно (закрывает WS и БД, src/index.js gracefulShutdown)
    stop_grace_period: 15s
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g
  watchtower:
    # Обновлятель: скачивает новый образ бота и перезапускает контейнер. Поддерживаемый форк
    # (исходный containrrr/watchtower не обновлялся с 2024 и не работает с новыми версиями Docker).
    # По умолчанию обновляет ТОЛЬКО по кнопке в панели (HTTP API). Автообновление по расписанию —
    # WATCHTOWER_AUTO=true и WATCHTOWER_SCHEDULE в .env (см. .env.example).
    image: ghcr.io/nicholas-fedor/watchtower:1.23
    container_name: ${STACK_NAME:-toncity}_watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: ${STACK_NAME:-toncity}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN:?задайте WATCHTOWER_TOKEN в .env}
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: ${WATCHTOWER_AUTO:-false}
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE:-0 0 21 * * *}
      TZ: UTC
    labels:
      com.centurylinklabs.watchtower.scope: ${STACK_NAME:-toncity}
    # Порт наружу НЕ публикуется: HTTP API доступен только боту внутри сети compose.
    restart: unless-stopped
volumes:
  db_data:
