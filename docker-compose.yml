services:
  db:
    image: mariadb:10.11
    # Имя контейнера параметризовано, чтобы на одном хосте можно было поднять НЕСКОЛЬКО
    # экземпляров бота. container_name — глобально уникальное имя на весь демон Docker, его не
    # спасает даже отдельный проект compose (в отличие от volume/network, которым compose сам
    # приписывает префикс проекта) — отсюда «Conflict. The container name is already in use».
    # Второй экземпляр: свой каталог, свой .env со STACK_NAME/WEB_PORT/DB_EXPOSED_PORT.
    container_name: ${STACK_NAME:-toncity}_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-db_main}
    ports:
      - "${DB_EXPOSED_PORT:-3377}:3306"
    volumes:
      - ./db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 10
  bot:
    build: .
    container_name: ${STACK_NAME:-toncity}_bot
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      # В контейнере слушаем на всех интерфейсах, иначе публикация порта (ports) не достучится
      # до приложения. Доступ снаружи защищён паролем веб-панели (задаётся в Настройках).
      WEB_BIND: 0.0.0.0
    command: npx nodemon
    ports:
      # ОБЕ стороны берём из WEB_PORT — приложение внутри контейнера слушает именно этот порт
      # (src/config.js: webPort=process.env.WEB_PORT), а не захардкоженный 3000. Раньше правая
      # часть была захардкожена как 3000 — при смене WEB_PORT в .env на что-то другое (напр. 3396)
      # проброс уезжал "хост:3396 → контейнер:3000", а внутри контейнера уже никто не слушал 3000
      # (переехало на 3396) — панель становилась недоступна снаружи без единой ошибки в логах.
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./src:/app/src
      # РАНЬШЕ здесь был отдельный именованный volume поверх ./src/web/dist — специально чтобы
      # пустой bind-mount с хоста (если фронтенд там ещё ни разу не собирали) не затирал собранный
      # В ОБРАЗЕ фронтенд пустой директорией. Убрано (31.07.2026): раз фронтенд теперь регулярно
      # пересобирается ПРЯМО НА ХОСТЕ (npm run build в src/web/client → src/web/dist), тот volume
      # только мешал — держал СТАРУЮ копию, никогда не обновлявшуюся сам по себе, и каждое
      # обновление фронта требовало ручного docker cp внутрь контейнера. Теперь dist читается
      # НАПРЯМУЮ из хоста через bind-mount ./src — простой пересборки на хосте (npm run build)
      # достаточно, контейнер видит файлы сразу же, без docker cp/restart, PWA-автообновление
      # (registerSW.ts) само подхватывает новый бандл при обновлении страницы.
      # ВАЖНО для НОВОГО/чистого разворачивания: перед первым запуском обязательно собрать фронтенд
      # на хосте (cd src/web/client && npm install && npm run build), иначе dist/ будет пуст.
      - ./nodemon.json:/app/nodemon.json
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g
volumes:
  db_data:
